[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openaxis-sigwire"
version = "0.1.0"
description = "Signal in the Wire — AI-ranked news aggregator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
mcp = [
    "openaxis-core>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["openaxis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
