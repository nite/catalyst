services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file: ../../.env
    volumes:
      - sigwire-data:/app/data

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8001
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sigwire-data:
